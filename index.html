<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculo de tu IMC</title>
</head>
<body>
    <form action="">
        <label for="peso">Peso (en kg):</label>
        <input type="text" name="peso" id="peso"><br>

        <label for="altura">Altura (en cm):</label>
        <input type="text" name="altura" id="altura"><br>

        <label for="imc">IMC calculado:</label>
        <input type="text" name="imc" id="imc"><br>

        <label for="resultado">Resultado:</label>
        <input type="text" name="resultado" id="resultado"><br>

        <button id="btnCalcular">Calcular</button>
        <button id="btnLimpiar">Limpiar</button>
    </form>
    <script src="js/IMC.js"></script>
</body>
</html>
